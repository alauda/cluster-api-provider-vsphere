---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: (unknown)
  name: vsphereresourcepools.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: VSphereResourcePool
    listKind: VSphereResourcePoolList
    plural: vsphereresourcepools
    singular: vsphereresourcepool
  scope: Namespaced
  versions:
  - name: v1beta1
    schema:
      openAPIV3Schema:
        description: VSphereResourcePool is the Schema for the vsphereresourcepools
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VSphereResourcePoolSpec defines the desired state of VSphereResourcePool.
            properties:
              clusterRef:
                description: |-
                  ClusterRef references the CAPI Cluster (in the same namespace) whose
                  VSphereCluster provides vCenter server, thumbprint, and credential
                  chain (IdentityRef) for this pool's vCenter operations (e.g. disk
                  reclaim). Required. Can only be changed when consumerRef is nil.
                  The pool will not reconcile until the referenced Cluster and its
                  VSphereCluster infrastructure are available.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              datacenter:
                description: |-
                  Datacenter is the default vSphere datacenter for slots in this pool.
                  It is used when a slot does not define its own Datacenter.
                type: string
              releaseDelayHours:
                description: |-
                  ReleaseDelayHours is the time to wait before marking a released slot as "Available" for any machine.
                  During this period, the slot can only be reused if specifically requested or via priority reuse.
                  Default is 24.
                type: integer
              resources:
                description: Resources is the list of pre-defined resource slots.
                items:
                  description: ResourceSlot defines a single resource slot in the
                    pool.
                  properties:
                    datacenter:
                      description: |-
                        Datacenter is the vSphere datacenter for this slot.
                        If set, it takes precedence over VSphereResourcePool.spec.datacenter.
                        If unset, the pool-level Datacenter acts as the default.
                      type: string
                    hostname:
                      description: Hostname is the unique identifier for this slot
                        and will be assigned to the VM. It must also be a valid
                        Kubernetes node name because CAPV uses it for kubeadm nodeRegistration.name
                        and the kubelet serving certificate DNS SAN.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    network:
                      description: Network configurations.
                      items:
                        description: NetworkConfig defines the network configuration
                          for a slot.
                        properties:
                          deviceName:
                            description: DeviceName explicitly assigns a guest OS interface
                              name to the network device.
                            type: string
                          dns:
                            description: DNS nameservers
                            items:
                              type: string
                            type: array
                          gateway:
                            type: string
                          ip:
                            description: IPv4 configuration
                            type: string
                          ipv6:
                            description: IPv6 configuration
                            type: string
                          ipv6Gateway:
                            type: string
                          networkName:
                            description: NetworkName is the name of the vSphere network
                              (PortGroup or DVPortGroup).
                            type: string
                        required:
                        - networkName
                        type: object
                      type: array
                    persistentDisks:
                      description: PersistentDisks that survive VM deletion.
                      items:
                        description: PersistentDisk defines a disk that survives VM
                          deletion.
                        properties:
                          datastore:
                            description: Datastore is the vSphere datastore name.
                            type: string
                          diskUUID:
                            description: DiskUUID is backfilled by the controller.
                            type: string
                          fsFormat:
                            description: FSFormat is the filesystem format (default
                              "ext4").
                            type: string
                          mountOptions:
                            description: MountOptions for the filesystem mount.
                            items:
                              type: string
                            type: array
                          mountPath:
                            description: MountPath is the mount path inside the VM
                              guest OS (e.g., "/var/lib/etcd").
                            type: string
                          name:
                            description: Name is the disk name.
                            type: string
                          sizeGiB:
                            description: SizeGiB is the disk size.
                            format: int32
                            type: integer
                          storagePolicy:
                            description: StoragePolicy is the vSphere storage policy
                              name.
                            type: string
                          unitNumber:
                            description: |-
                              UnitNumber is the SCSI unit number for the disk (0-15, excluding 7).
                              This ensures consistent disk ordering across VM recreations.
                            format: int32
                            type: integer
                          volumePath:
                            description: |-
                              VolumePath is backfilled by the controller after the disk is created.
                              For vSphere, this is usually the datastore path to the .vmdk file.
                            type: string
                        required:
                        - name
                        - sizeGiB
                        type: object
                      type: array
                  required:
                  - hostname
                  type: object
                type: array
            required:
            - clusterRef
            - resources
            type: object
          status:
            description: VSphereResourcePoolStatus defines the observed state of VSphereResourcePool.
            properties:
              consumerRef:
                description: |-
                  ConsumerRef is the workload controller (KubeadmControlPlane or MachineDeployment)
                  currently bound to this pool. Set automatically by the controller when a machine
                  allocates a slot. Cleared when the pool becomes fully reusable.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    type: string
                  kind:
                    description: Kind of the referent.
                    type: string
                  name:
                    description: Name of the referent.
                    type: string
                  namespace:
                    description: Namespace of the referent.
                    type: string
                  resourceVersion:
                    type: string
                  uid:
                    description: UID of the referent.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              conditions:
                description: Conditions defines current state of the resource pool.
                items:
                  description: Condition defines an observation of a Cluster API resource
                    operational state.
                  properties:
                    lastTransitionTime:
                      description: |-
                        Last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed. If that is not known, then using the time when
                        the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A human readable message indicating details about the transition.
                        This field may be empty.
                      type: string
                    reason:
                      description: |-
                        The reason for the condition's last transition in CamelCase.
                        The specific API may choose whether or not this field is considered a guaranteed API.
                        This field may not be empty.
                      type: string
                    severity:
                      description: |-
                        Severity provides an explicit classification of Reason code, so the users or machines can immediately
                        understand the current situation and act accordingly.
                        The Severity field MUST be set only when Status=False.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: |-
                        Type of condition in CamelCase or in foo.example.com/CamelCase.
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions
                        can be useful (see .node.status.conditions), the ability to deconflict is important.
                      type: string
                  required:
                  - lastTransitionTime
                  - status
                  - type
                  type: object
                type: array
              resourceStatuses:
                description: ResourceStatuses tracks the state of each slot.
                items:
                  description: ResourceSlotStatus tracks the state of a single slot.
                  properties:
                    hostname:
                      description: Hostname matches the Hostname in the Spec.
                      type: string
                    lastReleasedTime:
                      description: LastReleasedTime is the timestamp when the slot
                        transitioned to Released.
                      format: date-time
                      type: string
                    machineRef:
                      description: MachineRef is the reference to the Machine currently
                        using this slot.
                      properties:
                        apiVersion:
                          description: API version of the referent.
                          type: string
                        fieldPath:
                          type: string
                        kind:
                          description: Kind of the referent.
                          type: string
                        name:
                          description: Name of the referent.
                          type: string
                        namespace:
                          description: Namespace of the referent.
                          type: string
                        resourceVersion:
                          type: string
                        uid:
                          description: UID of the referent.
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    reclaimStatus:
                      description: ReclaimStatus tracks asynchronous reclaim progress
                        for this slot.
                      properties:
                        lastError:
                          description: LastError stores the latest reclaim task failure.
                          type: string
                        retryAfter:
                          description: RetryAfter prevents tight retry loops after
                            reclaim task failures.
                          format: date-time
                          type: string
                        state:
                          description: State tracks the lifecycle of the reclaim task.
                          type: string
                        taskRef:
                          description: TaskRef tracks the in-flight vCenter reclaim
                            task for this slot.
                          type: string
                        volumePath:
                          description: VolumePath tracks the persistent disk currently
                            being reclaimed.
                          type: string
                      type: object
                    state:
                      description: 'State can be: Available, InUse, Released'
                      type: string
                  required:
                  - hostname
                  - state
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
